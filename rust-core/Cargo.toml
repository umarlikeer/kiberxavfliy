[package]
name = "kiberxavfliy-core"
version = "1.0.0"
edition = "2021"
authors = ["KiberXavfliy Team"]
description = "Core security engine for KiberXavfliy iOS app"
license = "MIT"
repository = "https://github.com/umarlikeer/kiberxavfliy"

[lib]
name = "kiberxavfliy_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
sha2 = "0.10"
md5 = "0.7"
base64 = "0.22"
regex = "1.10"
url = "2.5"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
